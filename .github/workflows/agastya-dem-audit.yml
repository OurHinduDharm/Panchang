name: Agastya GEDTM30 research extraction

on:
  push:
    branches:
      - research/agastya-gedtm30-cog-extraction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-pithoragarh-window:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install raster tools
        run: python -m pip install --upgrade pip rasterio numpy skyfield

      - name: Extract source-georeferenced GEDTM30 window
        run: |
          python research/agastya/gedtm30_extract.py \
            --out artifacts/GEDTM30_Pithoragarh_N29E080.tif \
            --metadata artifacts/GEDTM30_Pithoragarh_N29E080.metadata.json

      - name: Compute conditional terrain horizon
        run: |
          python research/agastya/terrain_horizon.py \
            --dem artifacts/GEDTM30_Pithoragarh_N29E080.tif \
            --json artifacts/agastya_terrain_horizon.json \
            --csv artifacts/agastya_terrain_horizon.csv \
            --max-distance-m 20000 \
            --step-m 30

      - name: Compute Canopus twilight and terrain-clearance candidates
        run: |
          python research/agastya/canopus_twilight_clearance.py \
            --horizon-csv artifacts/agastya_terrain_horizon.csv \
            --years 2026 2027 \
            --json artifacts/canopus_twilight_clearance.json \
            --csv artifacts/canopus_twilight_clearance.csv

      - name: Upload DEM extraction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agastya-gedtm30-pithoragarh-audit
          path: |
            artifacts/GEDTM30_Pithoragarh_N29E080.tif
            artifacts/GEDTM30_Pithoragarh_N29E080.metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload compact terrain horizon report
        uses: actions/upload-artifact@v4
        with:
          name: agastya-terrain-horizon-report
          path: |
            artifacts/agastya_terrain_horizon.json
            artifacts/agastya_terrain_horizon.csv
            artifacts/canopus_twilight_clearance.json
            artifacts/canopus_twilight_clearance.csv
          if-no-files-found: error
          retention-days: 30
