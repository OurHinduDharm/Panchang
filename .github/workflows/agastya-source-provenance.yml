name: Validate Agastya traditional source provenance

on:
  push:
    paths:
      - "data/agastya-arghya-pithoragarh.json"
      - "research/agastya/traditional-arghya-source-provenance-audit.json"
      - "tests/agastya-traditional-source-provenance.test.mjs"
      - ".github/workflows/agastya-source-provenance.yml"
  pull_request:
    paths:
      - "data/agastya-arghya-pithoragarh.json"
      - "research/agastya/traditional-arghya-source-provenance-audit.json"
      - "tests/agastya-traditional-source-provenance.test.mjs"
      - ".github/workflows/agastya-source-provenance.yml"

permissions:
  contents: read

jobs:
  validate-agastya-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source provenance and public-data invariance
        run: node --test tests/agastya-traditional-source-provenance.test.mjs
