name: Asta-Udaya phase diagnostics browser test

on:
  push:
    branches: [feat/drik-modern-planetary-asta-udaya-20261104]
    paths:
      - "tests/capture-drik-pithoragarh-asta.mjs"
      - "tests/report-drik-five-city-leave-one-city-out.mjs"
      - "extra-panchang.js"
      - "research/drik-planetary-reference.mjs"
      - "tests/drik-planetary-reference.test.mjs"
      - "tests/capture-drik-multicity-asta.mjs"
      - "tests/drik-pithoragarh-asta-data.test.mjs"
      - "tests/drik-multicity-asta-data.test.mjs"
      - "data/drik-multicity-asta-udaya-2024-2028.json"
      - "data/drik-planetary-reference-2024-2027.json"
      - "tests/report-pithoragarh-direct-drik-blind-holdout.mjs"
      - "tests/report-pithoragarh-local-year-holdout.mjs"
      - "tests/report-pithoragarh-direction-year-holdout.mjs"
      - "tests/report-pithoragarh-city-year-holdout.mjs"
      - "tests/report-pithoragarh-motion-feature-holdout.mjs"
      - "tests/report-drik-five-city-leave-one-city-out.mjs"
      - "tests/report-drik-five-city-leave-one-city-out.mjs"
      - "tests/planetary-visibility-selector.test.mjs"
      - "research/planetary-visibility-selector.mjs"
      - "data/drik-pithoragarh-asta-udaya-2024-2027.json"
      - "data/drik-pithoragarh-asta-udaya-2021-2027.json"
      - "tests/drik-pithoragarh-asta-extended-data.test.mjs"
      - "tests/asta-udaya-phase-diagnostics.spec.mjs"
      - ".github/workflows/asta-udaya-phase-diagnostics.yml"
  pull_request:
    branches: [main]
    paths:
      - "extra-panchang.js"
      - "tests/asta-udaya-phase-diagnostics.spec.mjs"
      - "tests/swiss-heliacal-comparison.html"
      - "tests/run-swiss-heliacal-comparison.mjs"
      - "tests/capture-drik-pithoragarh-asta.mjs"
      - "data/asta-udaya-benchmark.json"
      - "research/drik-planetary-reference.mjs"
      - "tests/drik-planetary-reference.test.mjs"
      - "data/drik-planetary-reference-2024-2027.json"
      - ".github/workflows/asta-udaya-phase-diagnostics.yml"

permissions:
  contents: read

jobs:
  browser-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser test dependency
        run: npm install --no-save playwright@1.55.0 astronomy-engine@2.1.19
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve repository files
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/asta-udaya-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/asta-udaya-http.log
          exit 1
      - name: Compare Swiss heliacal visibility with published and provisional Pithoragarh boundaries
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Swiss heliacal validation')
        run: node tests/run-swiss-heliacal-comparison.mjs
      - name: Capture Drik Pithoragarh five-planet named-city pages without city fallback
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Pithoragarh source capture')
        run: node tests/capture-drik-pithoragarh-asta.mjs
      - name: Capture direct Drik multi-city annual Asta pages
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'multi-city source capture')
        run: node tests/capture-drik-multicity-asta.mjs
      - name: Validate direct Drik Pithoragarh source ledger
        run: node --test tests/drik-pithoragarh-asta-data.test.mjs
      - name: Validate extended 2021–2027 Pithoragarh ledger and quarantined years
        run: node --test tests/drik-pithoragarh-asta-extended-data.test.mjs
      - name: Validate five-city Drik source provenance, dates and selector anomalies
        run: node --test tests/drik-multicity-asta-data.test.mjs
      - name: Run New Delhi-trained model against direct Pithoragarh Drik holdout
        run: node tests/report-pithoragarh-direct-drik-blind-holdout.mjs
      - name: Run Pithoragarh location-calibrated leave-one-year-out validation
        run: node tests/report-pithoragarh-local-year-holdout.mjs
      - name: Compare Mercury event-direction models in Pithoragarh year holdouts
        run: node tests/report-pithoragarh-direction-year-holdout.mjs
      - name: Validate pooled multi-city plus local-history Pithoragarh city-year holdouts
        run: node tests/report-pithoragarh-city-year-holdout.mjs
      - name: Test planetary visibility selector and retrograde/direct motion features
        run: node --test tests/planetary-visibility-selector.test.mjs
      - name: Compare Mercury/Venus retrograde-aware model variants
        run: node tests/report-pithoragarh-motion-feature-holdout.mjs
      - name: Run five-city leave-one-city-out Asta/Udaya transfer validation
        run: node tests/report-drik-five-city-leave-one-city-out.mjs
      - name: Test direct Drik planetary reference lookup and no-fallback policy
        run: node --test tests/drik-planetary-reference.test.mjs
      - name: Verify direct Drik Panchang card, no provisional display and unchanged performance mode
        run: node --test tests/asta-udaya-phase-diagnostics.spec.mjs
