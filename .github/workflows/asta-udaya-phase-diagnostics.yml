name: Asta-Udaya phase diagnostics browser test

on:
  pull_request:
    branches: [main]
    paths:
      - "extra-panchang.js"
      - "tests/asta-udaya-phase-diagnostics.spec.mjs"
      - "tests/swiss-heliacal-comparison.html"
      - "tests/run-swiss-heliacal-comparison.mjs"
      - "tests/report-longitude-threshold-boundaries.mjs"
      - "tests/report-drik-longitude-threshold-boundaries.mjs"
      - "tests/asta-udaya-benchmark.test.mjs"
      - "tests/verified-horizon-crossing-check.mjs"
      - "tests/report-planet-horizon-twilight-boundaries.mjs"
      - "tests/report-new-delhi-twilight-threshold-holdout.mjs"
      - "ASTA-UDAYA-BENCHMARK-AUDIT.md"
      - "data/asta-udaya-benchmark.json"
      - ".github/workflows/asta-udaya-phase-diagnostics.yml"

permissions:
  contents: read

jobs:
  browser-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser test dependency
        run: npm install --no-save playwright@1.55.0 astronomy-engine@2.1.19
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve repository files
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/asta-udaya-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/asta-udaya-http.log
          exit 1
      - name: Verify topocentric estimate, search direction, cache scope, and benchmark provenance
        run: >-
          node --test
          tests/planetary-asta-udaya-topocentric.test.mjs
          tests/planetary-asta-udaya-direction.test.js
          tests/planetary-asta-udaya-location-scope.test.mjs
          tests/planetary-boundary-cache.test.mjs
          tests/asta-udaya-benchmark.test.mjs
          tests/verified-horizon-crossing-check.mjs
      - name: Profile local twilight geometry at independently indexed Pithoragarh Venus boundaries
        run: node tests/report-planet-horizon-twilight-boundaries.mjs
      - name: Profile magnitude, phase, elongation, and twilight across 11 New Delhi holdout windows
        run: node tests/report-new-delhi-twilight-threshold-holdout.mjs
      - name: Compare fixed-angle candidates with Drik New Delhi 2027 boundaries
        run: node tests/report-drik-longitude-threshold-boundaries.mjs
      - name: Diagnose fixed geocentric longitude thresholds against TRAC 2027 boundaries
        run: node tests/report-longitude-threshold-boundaries.mjs
      - name: Report signed differences against published Pithoragarh Drik boundaries
        run: node tests/report-drik-asta-udaya-similarity.mjs
      - name: Compare Swiss heliacal visibility with published and provisional Pithoragarh boundaries
        run: node tests/run-swiss-heliacal-comparison.mjs
      - name: Verify opt-in counters and unchanged visible output
        run: node --test tests/asta-udaya-phase-diagnostics.spec.mjs
