name: Classical yoga interval tests

on:
  push:
    branches:
      - main
      - "fix/classical-yogas-extra-panchang"
      - "fix/compact-panchang-ui-night-prahar"
    paths:
      - "app.js"
      - "extra-panchang.js"
      - "classical-yogas.js"
      - "tests/classical-yogas-intervals.test.js"
      - "tests/classical-yogas-real-panchang-comparison.test.js"
      - "tests/classical-yogas-drik-reference.test.js"
      - "tests/panchang-card-order.test.js"
      - "tests/compact-ui-night-prahar.test.js"
      - "festival-muhurta.js"
      - "tests/festival-muhurta.test.js"
      - "festival-images.js"
      - "tests/festival-images.test.js"
      - "tests/monthly-festival-data.test.mjs"
      - "monthly-vrat-parv.html"
      - "data/festivals/**"
      - ".github/workflows/classical-yogas-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app.js"
      - "extra-panchang.js"
      - "classical-yogas.js"
      - "tests/classical-yogas-intervals.test.js"
      - "tests/classical-yogas-real-panchang-comparison.test.js"
      - "tests/panchang-card-order.test.js"
      - "tests/compact-ui-night-prahar.test.js"
      - "festival-muhurta.js"
      - "tests/festival-muhurta.test.js"
      - "tests/monthly-festival-data.test.mjs"
      - "monthly-vrat-parv.html"
      - "data/festivals/**"
      - ".github/workflows/classical-yogas-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interval-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Panchang calculation library
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Syntax-check browser JavaScript
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < extra-panchang.js
          node --input-type=module --check < festival-muhurta.js
          node --input-type=module --check < festival-images.js
          node --check classical-yogas.js
      - name: Run monthly festival data and preview guardrail tests
        run: node --experimental-default-type=module --test tests/monthly-festival-data.test.mjs
      - name: Run festival muhurta rule tests
        run: node --experimental-default-type=module --test tests/festival-muhurta.test.js
      - name: Run licensed festival image mapping tests
        run: node --experimental-default-type=module --test tests/festival-images.test.js
      - name: Run Panchang card-order regression tests
        run: node --test tests/panchang-card-order.test.js
      - name: Run compact UI and night Prahar regression tests
        run: node --test tests/compact-ui-night-prahar.test.js
      - name: Run interval and real Panchang comparison tests
        run: node --test tests/classical-yogas-intervals.test.js tests/classical-yogas-real-panchang-comparison.test.js tests/classical-yogas-drik-reference.test.js
