name: Classical yoga interval tests

on:
  push:
    branches:
      - main
      - "fix/classical-yogas-extra-panchang"
      - "fix/compact-panchang-ui-night-prahar"
      - "data/festival-json-foundation"
    paths:
      - "app.js"
      - "extra-panchang.js"
      - "classical-yogas.js"
      - "tests/classical-yogas-intervals.test.js"
      - "tests/vrata-intervals.test.js"
      - "tests/vrata-real-date-diagnostic.test.js"
      - "tests/shravana-dvadashi-rule-profile.test.js"
      - "tests/shravana-dvadashi-duration-branch.test.js"
      - "tests/classical-yogas-real-panchang-comparison.test.js"
      - "tests/classical-yogas-drik-reference.test.js"
      - "tests/panchang-card-order.test.js"
      - "tests/compact-ui-night-prahar.test.js"
      - ".github/workflows/classical-yogas-tests.yml"
      - "data/references/vrata-real-date-crosscheck-2026-10-14.md"
      - "data/festivals.json"
      - "tests/festival-season-2026.test.js"
      - "tests/festival-tithi-diagnostic-2026.test.js"
      - "festival-muhurta-rules.js"
      - "festival-muhurta-engine.js"
      - "festival-muhurta-widget.js"
      - "festival-json-widget.js"
      - "data/festivalData-source.txt"
      - "festival-preview.html"
      - "test-pr.html"
      - "data/README.md"
      - "data/references/sharad-navaratri-2026-date-audit.md"
      - "data/references/festival-priority-audit-2026-10-15.md"
      - "tests/festival-json-widget.test.js"
      - "tests/festival-muhurta-widget.test.js"
      - "tests/festival-muhurta-engine.test.js"
      - "tests/festival-muhurta-rules.test.js"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app.js"
      - "extra-panchang.js"
      - "classical-yogas.js"
      - "tests/classical-yogas-intervals.test.js"
      - "tests/vrata-intervals.test.js"
      - "tests/vrata-real-date-diagnostic.test.js"
      - "tests/shravana-dvadashi-rule-profile.test.js"
      - "tests/shravana-dvadashi-duration-branch.test.js"
      - "tests/classical-yogas-real-panchang-comparison.test.js"
      - "tests/panchang-card-order.test.js"
      - "tests/compact-ui-night-prahar.test.js"
      - ".github/workflows/classical-yogas-tests.yml"
      - "data/festivals.json"
      - "tests/festival-season-2026.test.js"
      - "tests/festival-tithi-diagnostic-2026.test.js"
      - "festival-muhurta-rules.js"
      - "festival-muhurta-engine.js"
      - "tests/festival-muhurta-rules.test.js"
      - "tests/festival-muhurta-engine.test.js"
      - "festival-muhurta-widget.js"
      - "festival-json-widget.js"
      - "tests/festival-json-widget.test.js"
      - "data/festivalData-source.txt"
      - "festival-preview.html"
      - "test-pr.html"
      - "data/README.md"
      - "data/references/sharad-navaratri-2026-date-audit.md"
      - "data/references/festival-priority-audit-2026-10-15.md"
      - "tests/festival-muhurta-widget.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interval-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Panchang calculation library
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Syntax-check browser JavaScript
        run: |
          node --check festival-json-widget.js
          node --input-type=module --check < app.js
          node --input-type=module --check < extra-panchang.js
          node --check classical-yogas.js
          node --check festival-muhurta-rules.js
          node --check festival-muhurta-engine.js
          node --check festival-muhurta-widget.js
      - name: Run 2026 festival-season data guardrails
        run: node --test tests/festival-season-2026.test.js
      - name: Run JSON-backed upcoming festival widget tests
        run: node --test tests/festival-json-widget.test.js
      - name: Run reusable festival muhurta rule tests
        run: node --test tests/festival-muhurta-rules.test.js
      - name: Run location-aware Ghatasthapana engine tests
        run: node --test tests/festival-muhurta-engine.test.js
      - name: Run festival-card location/status widget tests
        run: node --test tests/festival-muhurta-widget.test.js
      - name: Calculate Pithoragarh festival tithi interval diagnostics
        if: always()
        run: node --test tests/festival-tithi-diagnostic-2026.test.js
      - name: Upload festival tithi diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-tithi-diagnostic-2026
          path: artifacts/festival-tithi-diagnostic-2026.json
          if-no-files-found: warn
      - name: Run Panchang card-order regression tests
        run: node --test tests/panchang-card-order.test.js
      - name: Run compact UI and night Prahar regression tests
        run: node --test tests/compact-ui-night-prahar.test.js
      - name: Run isolated vrata interval contract tests
        run: node --test tests/vrata-intervals.test.js
      - name: Run guarded Shravana-Dvadashi rule-profile tests
        if: always()
        run: node --test tests/shravana-dvadashi-rule-profile.test.js
      - name: Run conditional Shravana-Dvadashi duration-branch tests
        if: always()
        run: node --test tests/shravana-dvadashi-duration-branch.test.js
      - name: Emit fixed-coordinate vrata date diagnostics (not a correctness fixture)
        if: always()
        run: node --test tests/vrata-real-date-diagnostic.test.js
      - name: Upload fixed-coordinate vrata diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrata-real-date-diagnostic
          path: artifacts/vrata-real-date-diagnostic.json
          if-no-files-found: warn
      - name: Run interval and real Panchang comparison tests
        run: node --test tests/classical-yogas-intervals.test.js tests/classical-yogas-real-panchang-comparison.test.js tests/classical-yogas-drik-reference.test.js
