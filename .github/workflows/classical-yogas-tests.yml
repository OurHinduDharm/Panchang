name: Classical yoga interval tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "classical-yogas.js"
      - "tests/classical-yogas-intervals.test.js"
      - "tests/classical-yogas-real-panchang-comparison.test.js"
      - ".github/workflows/classical-yogas-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interval-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Panchang calculation library
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Run interval and real Panchang comparison tests
        run: node --test tests/classical-yogas-intervals.test.js tests/classical-yogas-real-panchang-comparison.test.js
