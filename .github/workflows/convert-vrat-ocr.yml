name: Convert Vrat Parichay OCR gzip to txt
on:
  push:
    paths:
      - ".github/workflows/convert-vrat-ocr.yml"
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decompress OCR text and remove temporary workflow
        run: |
          gzip -dc "610 Vrat Parichay_hocr_searchtext.txt.gz" > "610 Vrat Parichay_hocr_searchtext.txt"
          rm ".github/workflows/convert-vrat-ocr.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "610 Vrat Parichay_hocr_searchtext.txt" ".github/workflows/convert-vrat-ocr.yml"
          git commit -m "Add decompressed Vrat Parichay OCR text"
          git push
