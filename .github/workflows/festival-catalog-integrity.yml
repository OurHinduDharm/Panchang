name: Festival catalog and muhurta integrity audit
on:
  push:
    branches:
      - audit/2026-festival-catalog-integrity
    paths:
      - 'data/festivals/*.json'
      - 'festival-muhurta.js'
      - 'tests/festival-muhurta-parana.test.mjs'
      - 'tests/narak-chaturdashi-real-panchang-2026.test.mjs'
      - 'scripts/audit-festival-catalog.mjs'
      - 'tests/festival-catalog-integrity.test.mjs'
      - '.github/workflows/festival-catalog-integrity.yml'
  pull_request:
    paths:
      - 'data/festivals/*.json'
      - 'festival-muhurta.js'
      - 'tests/festival-muhurta-parana.test.mjs'
      - 'tests/narak-chaturdashi-real-panchang-2026.test.mjs'
      - 'scripts/audit-festival-catalog.mjs'
      - 'tests/festival-catalog-integrity.test.mjs'
      - '.github/workflows/festival-catalog-integrity.yml'
permissions:
  contents: read
jobs:
  catalog-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run integrity unit tests
        run: node --test tests/festival-catalog-integrity.test.mjs
      - name: Install pinned Panchang engine for location regression
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Run festival muhurta regression tests
        run: node --test tests/festival-muhurta-parana.test.mjs tests/narak-chaturdashi-real-panchang-2026.test.mjs
      - name: Diagnose missing 2027-2028 tithi metadata
        run: node --test tests/diagnose-missing-tithi-2027-2028.test.js
      - name: Audit published month catalogs
        run: |
          for year in 2026 2027 2028 2029; do
            node scripts/audit-festival-catalog.mjs "$year"
          done
