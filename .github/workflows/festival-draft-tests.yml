name: Festival and Vrata Draft Regression Tests

on:
  push:
    branches:
      - data/festival-json-foundation
    paths:
      - 'data/festivals.json'
      - 'data/festival-schema.json'
      - 'data/festival-overrides.json'
      - 'data/festival-overrides.schema.json'
      - 'data/muhurta-rules.json'
      - 'data/FESTIVAL-MUHURAT-DISPLAY-PLAN.md'
      - 'festival-json-widget.js'
      - 'festival-date-resolver.js'
      - 'kalashtami-panchang-adapter.js'
      - 'kalashtami-preview.html'
      - 'tests/kalashtami-panchang-adapter.test.js'
      - 'festival-muhurta-*.js'
      - 'ambubachi-calculation.js'
      - 'tests/festival-*.test.js'
      - 'tests/ambubachi-calculation.test.js'
      - 'tests/ekadashi-*.test.js'
      - 'tests/vrata-*.test.js'
      - 'tests/shravana-dvadashi-*.test.js'
      - '.github/workflows/festival-draft-tests.yml'
  pull_request:
    paths:
      - 'data/festivals.json'
      - 'data/festival-schema.json'
      - 'data/festival-overrides.json'
      - 'data/festival-overrides.schema.json'
      - 'data/muhurta-rules.json'
      - 'data/FESTIVAL-MUHURAT-DISPLAY-PLAN.md'
      - 'festival-json-widget.js'
      - 'festival-date-resolver.js'
      - 'kalashtami-panchang-adapter.js'
      - 'kalashtami-preview.html'
      - 'tests/kalashtami-panchang-adapter.test.js'
      - 'festival-muhurta-*.js'
      - 'ambubachi-calculation.js'
      - 'tests/festival-*.test.js'
      - 'tests/ambubachi-calculation.test.js'
      - 'tests/ekadashi-*.test.js'
      - 'tests/vrata-*.test.js'
      - 'tests/shravana-dvadashi-*.test.js'
      - '.github/workflows/festival-draft-tests.yml'

permissions:
  contents: read

jobs:
  festival-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JSON files
        run: node -e "JSON.parse(require('fs').readFileSync('data/festivals.json', 'utf8')); JSON.parse(require('fs').readFileSync('data/festival-schema.json', 'utf8')); JSON.parse(require('fs').readFileSync('data/festival-overrides.json', 'utf8')); JSON.parse(require('fs').readFileSync('data/festival-overrides.schema.json', 'utf8')); JSON.parse(require('fs').readFileSync('data/muhurta-rules.json', 'utf8')); console.log('Festival JSON files parse successfully')"
      - name: Run festival, muhurta, and vrata regression tests
        run: node --test tests/festival-catalog-guardrails.test.js tests/festival-date-resolver.test.js tests/festival-json-widget.test.js tests/kalashtami-panchang-adapter.test.js tests/festival-season-2026.test.js tests/festival-muhurta-engine.test.js tests/festival-muhurta-rules.test.js tests/festival-muhurta-widget.test.js tests/ambubachi-calculation.test.js tests/ekadashi-*.test.js tests/vrata-intervals.test.js tests/shravana-dvadashi-duration-branch.test.js tests/shravana-dvadashi-rule-profile.test.js
