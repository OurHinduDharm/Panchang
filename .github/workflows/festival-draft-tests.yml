name: Festival Draft Regression Tests

on:
  push:
    branches:
      - data/festival-json-foundation
    paths:
      - 'data/festivals.json'
      - 'data/festival-schema.json'
      - 'data/festival-overrides.json'
      - 'data/festival-overrides.schema.json'
      - 'festival-json-widget.js'
      - 'festival-muhurta-*.js'
      - 'ambubachi-calculation.js'
      - 'tests/festival-*.test.js'
      - 'tests/ambubachi-calculation.test.js'
      - '.github/workflows/festival-draft-tests.yml'
  pull_request:
    paths:
      - 'data/festivals.json'
      - 'data/festival-schema.json'
      - 'data/festival-overrides.json'
      - 'data/festival-overrides.schema.json'
      - 'festival-json-widget.js'
      - 'festival-muhurta-*.js'
      - 'ambubachi-calculation.js'
      - 'tests/festival-*.test.js'
      - 'tests/ambubachi-calculation.test.js'
      - '.github/workflows/festival-draft-tests.yml'

jobs:
  festival-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JSON files
        run: node -e "JSON.parse(require('fs').readFileSync('data/festivals.json', 'utf8')); JSON.parse(require('fs').readFileSync('data/festival-schema.json', 'utf8')); JSON.parse(require('fs').readFileSync('data/festival-overrides.json', 'utf8')); JSON.parse(require('fs').readFileSync('data/festival-overrides.schema.json', 'utf8')); console.log('Festival JSON files parse successfully')"
      - name: Run festival and muhurta regression tests
        run: node --test tests/festival-catalog-guardrails.test.js tests/festival-json-widget.test.js tests/festival-season-2026.test.js tests/festival-muhurta-engine.test.js tests/festival-muhurta-rules.test.js tests/festival-muhurta-widget.test.js tests/ambubachi-calculation.test.js
