name: Kalashtami local date review
on:
  push:
    branches:
      - review/2026-kalashtami-local-audit
    paths:
      - 'tests/fixtures/kalashtami-panchang-adapter.js'
      - 'tests/kalashtami-2026-local-audit.test.mjs'
      - '.github/workflows/kalashtami-local-audit.yml'
  pull_request:
    paths:
      - 'tests/fixtures/kalashtami-panchang-adapter.js'
      - 'tests/kalashtami-2026-local-audit.test.mjs'
      - '.github/workflows/kalashtami-local-audit.yml'
permissions:
  contents: read
jobs:
  kalashtami-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Panchang engine
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Compare selected Kalashtami dates
        run: node --test tests/kalashtami-2026-local-audit.test.mjs
