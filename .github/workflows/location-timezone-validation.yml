name: Location timezone validation

on:
  pull_request:
    paths:
      - "app.js"
      - "extra-panchang.js"
      - "monthly-vrat-parv-widget.js"
      - "eclipse-panchang.js"
      - "festival-muhurta.js"
      - "tithi-vyapti.js"
      - "location-timezone.mjs"
      - "vendor/tz-lookup-11.8.0.mjs"
      - "tests/monthly-location-timezone.test.mjs"
      - "tests/monthly-muhurta-timezone-followup.test.mjs"
      - "tests/location-timezone.test.mjs"
      - ".github/workflows/location-timezone-validation.yml"
  push:
    branches:
      - "fix/location-aware-timezones"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check extra-panchang.js
          node --check location-timezone.mjs
          node --check monthly-vrat-parv-widget.js
          node --check eclipse-panchang.js
          node --check festival-muhurta.js
          node --check tithi-vyapti.js
      - name: Run timezone tests
        run: node --test tests/location-timezone.test.mjs tests/monthly-location-timezone.test.mjs tests/monthly-muhurta-timezone-followup.test.mjs
