name: Signed Mahapata independent audit
on:
  pull_request:
    paths:
      - 'scripts/audit-mahapata-signed.py'
      - 'scripts/audit-mahapata-swiss.py'
      - 'scripts/scan-mahapata-signed.py'
      - '.github/workflows/mahapata-signed-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research dependencies
        run: python -m pip install pyswisseph==2.10.3.2 numpy==2.2.6 scipy==1.15.3
      - name: Compile research scripts
        run: python -m py_compile scripts/audit-mahapata-signed.py scripts/audit-mahapata-swiss.py scripts/scan-mahapata-signed.py
      - name: Check directed contacts
        run: python scripts/audit-mahapata-signed.py --self-test
      - name: Compare annual signed roots at two resolutions
        run: python scripts/scan-mahapata-signed.py
