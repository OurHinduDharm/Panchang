name: Paatadhikara research maths tests

on:
  pull_request:
    paths:
      - 'research/paatadhikar/**'
      - 'tests/paatadhikar-*.mjs'
      - 'tests/mahapat*.mjs'
      - 'tests/surya-siddhanta-paatadhikar.test.mjs'
      - 'scripts/*mahapat*.mjs'
      - 'mahapata-root-solver.mjs'
      - 'data/reviews/mahapat*.json'
      - '.github/workflows/paatadhikar-mahapata-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mahapata-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MIT-licensed astronomy engine
        run: npm install --no-save astronomy-engine@2.1.19
      - name: Check syntax
        run: |
          node --check research/paatadhikar/mahapata-math.mjs
          node --check research/paatadhikar/surya-siddhanta-xi.mjs
          node --check research/paatadhikar/astronomy-engine-adapter.mjs
          node --check tests/paatadhikar-mahapata-math.test.mjs
          node --check tests/surya-siddhanta-paatadhikar.test.mjs
          node --check tests/paatadhikar-astronomy-engine.integration.mjs
          node --check tests/mahapat-taraprasad-backtest.test.mjs
          node --check scripts/audit-mahapat-references.mjs
          node --check tests/mahapat-discovery-audit.test.mjs
      - name: Unit and ephemeris smoke tests
        run: node --test tests/paatadhikar-mahapata-math.test.mjs tests/surya-siddhanta-paatadhikar.test.mjs tests/paatadhikar-astronomy-engine.integration.mjs tests/mahapata-reference-check.test.mjs tests/mahapat-taraprasad-backtest.test.mjs tests/mahapat-discovery-audit.test.mjs
