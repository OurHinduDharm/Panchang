name: Paatadhikara research maths tests

on:
  pull_request:
    paths:
      - 'research/paatadhikar/**'
      - 'tests/paatadhikar-mahapata-math.test.mjs'
      - '.github/workflows/paatadhikar-mahapata-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mahapata-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check research/paatadhikar/mahapata-math.mjs
          node --check tests/paatadhikar-mahapata-math.test.mjs
      - name: Unit tests
        run: node --test tests/paatadhikar-mahapata-math.test.mjs
