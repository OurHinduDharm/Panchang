name: Pradosh real Panchang validation
on:
  push:
    branches:
      - verify/2026-pradosh-pithoragarh
    paths:
      - 'tests/pradosh-real-panchang-2026.test.js'
      - 'tests/recurring-tithi-scan-2026.test.js'
      - '.github/workflows/pradosh-panchang-validation.yml'
  pull_request:
    paths:
      - 'tests/pradosh-real-panchang-2026.test.js'
      - '.github/workflows/pradosh-panchang-validation.yml'
permissions:
  contents: read
jobs:
  pradosh-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Panchang engine
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Validate 2026 local tithi windows
        run: node --test tests/pradosh-real-panchang-2026.test.js
      - name: Scan recurring tithis at local sunrise
        run: node --test tests/recurring-tithi-scan-2026.test.js
