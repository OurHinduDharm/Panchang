name: Restore Vrat Parichay TXT into data
on:
  push:
    paths:
      - '.github/workflows/restore-vrat-txt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress source and clean up workflow
        run: |
          mkdir -p data
          gzip -dc "610 Vrat Parichay_hocr_searchtext.txt.gz" > "data/vrat-parichay.txt"
          rm -f "610 Vrat Parichay_hocr_searchtext.txt"
          rm -f ".github/workflows/restore-vrat-txt.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vrat-parichay.txt "610 Vrat Parichay_hocr_searchtext.txt" .github/workflows/restore-vrat-txt.yml
          git commit -m "Restore Vrat Parichay OCR text in data folder"
          git push
