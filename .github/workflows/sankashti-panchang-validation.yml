name: Sankashti real Panchang validation
on:
  push:
    branches:
      - verify/2026-sankashti-pithoragarh
    paths:
      - 'tests/sankashti-real-panchang-2026.test.js'
      - '.github/workflows/sankashti-panchang-validation.yml'
  pull_request:
    paths:
      - 'tests/sankashti-real-panchang-2026.test.js'
      - '.github/workflows/sankashti-panchang-validation.yml'
permissions:
  contents: read
jobs:
  sankashti-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Panchang engine
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Validate 2026 moonrise and tithi
        run: node --test tests/sankashti-real-panchang-2026.test.js
