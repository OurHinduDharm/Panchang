name: Special punya-kaal rule tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app.js"
      - "monthly-vrat-parv.html"
      - "monthly-special-punya-kaal.mjs"
      - "data/festivals/**"
      - "tests/varuni-catalog.test.mjs"
      - "monthly-religious-calendar.js"
      - "tests/monthly-religious-calendar.test.mjs"
      - "tests/special-punya-kaal-public-integration.test.mjs"
      - "docs/monthly-religious-calendar-architecture.md"
      - "docs/karana-kutuhula-mahapat-calculation-plan.md"
      - "data/reviews/mahapat-2023-2024-reference.json"
      - "docs/karanakutuhalam-1902-pata-crosscheck.md"
      - "data/special-punya-kaal/**"
      - "special-punya-kaal.mjs"
      - "special-punya-kaal-runtime.mjs"
      - "special-punya-kaal-public-approval.mjs"
      - "tests/special-punya-kaal-runtime.test.mjs"
      - "tests/special-punya-kaal-engine-integration.test.mjs"
      - "tests/special-punya-kaal-public-approval.test.mjs"
      - "mahapata-root-solver.mjs"
      - "karana-kutuhula-khanda-tables.mjs"
      - "karana-kutuhula-sthiti.mjs"
      - "tests/karana-kutuhula-khanda-tables.test.mjs"
      - "tests/karana-kutuhula-sthiti.test.mjs"
      - "tests/special-punya-kaal.test.mjs"
      - "tests/mahodaya.test.mjs"
      - "tests/mahapata-root-solver.test.mjs"
      - "tests/mahapata-reference-check.test.mjs"
      - "scripts/generate-special-punya-kaal-review.mjs"
      - "scripts/varuni-annual-review-cards.mjs"
      - "scripts/compare-mahapat-ephemeris.mjs"
      - ".github/workflows/special-punya-kaal-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interval-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned astronomy and Panchang engines
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0 astronomy-engine@2.1.19
      - name: Syntax check
        run: |
          node --experimental-default-type=module --check app.js
          node --check monthly-religious-calendar.js
          sed -n '/^<script type="module">$/,/^<\/script>$/p' monthly-vrat-parv.html | sed '1d;$d' > /tmp/monthly-vrat-parv.mjs
          node --check /tmp/monthly-vrat-parv.mjs
          node --check special-punya-kaal.mjs
          node --check special-punya-kaal-runtime.mjs
          node --check special-punya-kaal-public-approval.mjs
          node --check mahapata-root-solver.mjs
          node --check karana-kutuhula-khanda-tables.mjs
          node --check karana-kutuhula-sthiti.mjs
          node --check scripts/generate-special-punya-kaal-review.mjs
          node --check scripts/compare-mahapat-ephemeris.mjs
      - name: Run monthly religious calendar and special punya-kaal tests
        run: node --experimental-default-type=module --test tests/varuni-catalog.test.mjs tests/monthly-religious-calendar.test.mjs tests/special-punya-kaal-public-integration.test.mjs tests/special-punya-kaal-runtime.test.mjs tests/special-punya-kaal-engine-integration.test.mjs tests/special-punya-kaal-public-approval.test.mjs tests/special-punya-kaal.test.mjs tests/mahodaya.test.mjs tests/mahapata-root-solver.test.mjs tests/karana-kutuhula-khanda-tables.test.mjs tests/karana-kutuhula-sthiti.test.mjs tests/mahapat-2023-2024-reference.test.mjs
      - name: Generate 2026–2030 Pithoragarh research candidates
        run: node --experimental-default-type=module scripts/generate-special-punya-kaal-review.mjs
      - name: Generate future-year Varuni review cards (2031)
        run: node --experimental-default-type=module scripts/generate-special-punya-kaal-review.mjs --year 2031
      - name: Run Mahapata geocentric contact comparison (research-only)
        run: node --experimental-default-type=module scripts/compare-mahapat-ephemeris.mjs > data/reviews/mahapata-geocentric-comparison-2026-2030.json
      - name: Check Mahapata windows against pinned independent references
        run: node --experimental-default-type=module --test tests/mahapata-reference-check.test.mjs
      - name: Upload Mahapata comparison data
        uses: actions/upload-artifact@v4
        with:
          name: mahapata-geocentric-comparison-2026-2030
          path: data/reviews/mahapata-geocentric-comparison-2026-2030.json
          if-no-files-found: error
      - name: Upload Varuni review-only candidate data
        uses: actions/upload-artifact@v4
        with:
          name: special-punya-kaal-2026-2030-review-only
          path: |
            data/reviews/special-punya-kaal-2026-2030-candidates.json
            data/reviews/special-punya-kaal-2031-candidates.json
          if-no-files-found: error
