name: SS Chapter 9 Diagnostic Tests

on:
  push:
    branches:
      - "research/ss-ch9-diagnostic"
    paths:
      - "test-astronomy.html"
      - "ss_chapter9_test.js"
      - "ss_chapter7_drikkarma.js"
      - "ss_chapter7_test.js"
      - "ss_chapter3_lagnantara.js"
      - "ss_chapter9_browser_test.mjs"
      - ".github/workflows/ss-chapter9-diagnostic.yml"
  pull_request:
    paths:
      - "test-astronomy.html"
      - "ss_chapter7_test.js"
      - "ss_chapter9_test.js"
      - "ss_chapter7_drikkarma.js"
      - "ss_chapter3_lagnantara.js"
      - "ss_chapter9_browser_test.mjs"
      - ".github/workflows/ss-chapter9-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check helper syntax
        run: |
          node --experimental-default-type=module --check ss_chapter9_test.js
          node --experimental-default-type=module --check ss_chapter7_drikkarma.js
          node --experimental-default-type=module --check ss_chapter7_test.js
          node --experimental-default-type=module --check ss_chapter3_lagnantara.js

      - name: Run arithmetic and threshold-selection tests
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { runChapter9ArithmeticTests } from './ss_chapter9_test.js';
          const result = runChapter9ArithmeticTests();
          for (const test of result.tests) {
            console.log(`${test.passed ? 'PASS' : 'FAIL'} — ${test.name}`);
          }
          console.log(`${result.passed}/${result.total} tests passed`);
          if (!result.allPassed) process.exit(1);
          NODE

      - name: Run Chapter VII dṛkkarma formula checks
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { runChapter7DrikkarmaTests } from './ss_chapter7_drikkarma.js';
          const result = runChapter7DrikkarmaTests();
          for (const test of result.tests) {
            console.log(`${test.passed ? 'PASS' : 'FAIL'} — ${test.name}`);
          }
          console.log(`${result.passed}/${result.total} Chapter VII tests passed`);
          if (!result.allPassed) process.exit(1);
          NODE

      - name: Run source-derived Chapter VII arithmetic and sign tests
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { runChapter7SourceDerivedTests } from './ss_chapter7_test.js';
          const result = runChapter7SourceDerivedTests();
          for (const test of result.tests) {
            console.log(`${test.passed ? 'PASS' : 'FAIL'} — ${test.name}`);
            if (test.details) console.log(`  ${test.details}`);
          }
          console.log(`${result.passed}/${result.total} source-derived Chapter VII tests passed`);
          if (!result.allPassed) process.exit(1);
          NODE

      - name: Run Chapter III sign-rising interpolation tests
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { runChapter3LagnantaraTests } from './ss_chapter3_lagnantara.js';
          const result = runChapter3LagnantaraTests();
          for (const test of result.tests) {
            console.log(`${test.passed ? 'PASS' : 'FAIL'} — ${test.name}`);
          }
          console.log(`${result.passed}/${result.total} Chapter III tests passed`);
          if (!result.allPassed) process.exit(1);
          NODE

      - name: Check HTML structure and diagnostic wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('test-astronomy.html', 'utf8');
          const checks = [
            ['Chapter 9 threshold, classifier, and IX.10–11 helper imported', html.includes('chapter9Kalansha, classifyChapter9HorizonEvent, estimateChapter9TimeCorrectionFromArcMotions, runChapter9ArithmeticTests') && html.includes('from "./ss_chapter9_test.js"')],
            ['IX.10–11 signed estimate and bracket comparison rendered', html.includes('getChapter9TimeEstimate') && html.includes('IX.10–11 sequential estimate (days)') && html.includes('Estimate vs daily bracket (days)') && html.includes('data-estimate-bracket-error-days')],
            ['modern angular separation is shown separately from classical K', html.includes('eclipticLongitudeSeparationDeg') && html.includes('trueElongationDeg') && html.includes('Ecliptic Δλ') && html.includes('3-D elongation')],
            ['separate apparent-angle threshold scan is rendered', html.includes('findEclipticAngularThresholdCrossing') && html.includes('Ecliptic Δλ bracket') && html.includes('Δλ−C=')],
            ['IX.2–3 classifier controls event-time selection', html.includes('getClassifiedSunEventForDate') && html.includes('classifyChapter9HorizonEvent({') && html.includes('const direction = horizonEvent.startsWith("west-") ? "west" : "east";')],
            ['daily brackets never skip invalid/ambiguous dates', html.includes('b.date.getTime() - a.date.getTime() !== 86400000')],
            ['source-based threshold selector is used', html.includes('return chapter9Kalansha({ planet, horizonEvent, motionClass });')],
            ['Chapter VII helper imported and wired', html.includes('calculateChapter7SequentialDrikkarma, runChapter7DrikkarmaTests') && html.includes('runChapter7DrikkarmaTests()') && html.includes('from "./ss_chapter7_drikkarma.js"')],
            ['Chapter III sign-rising interpolation helper and browser tests imported', html.includes('chapter9LagnantaraAsus') && html.includes('runChapter3LagnantaraTests()') && html.includes('from "./ss_chapter3_lagnantara.js"')],
            ['Primary K uses Chapter III sign interpolation and retains exact-OA comparison', html.includes('const classical = chapter9LagnantaraAsus') && html.includes('exactK: exactLagnaInterval')],
            ['Chapter VII helper is used by sequential candidate', html.includes('return calculateChapter7SequentialDrikkarma({')],
            ['source apparent sidereal angle is transformed into the 24° calculation frame', html.includes('const localSiderealObliquityDeg = trueObliquityOfDateDeg(date)') && html.includes('    localSiderealObliquityDeg,') && html.includes('Sequential: frame correction')],
            ['Aksha display uses planet-specific meridian inputs', html.includes('planetRAForAksha') && html.includes('planetDeclinationForHalfDay') && !html.includes('akshaPointRA')],
            ['arithmetic test button exists', html.includes('id="runChapter9ArithmeticBtn"')],
            ['button callback is wired', html.includes('getElementById("runChapter9ArithmeticBtn")')],
            ['legacy Venus limitation disclosed', html.includes('not the event-direction rule of Sūrya-siddhānta IX.7')],
            ['unverified fixtures and coordinate-frame blocker disclosed in the UI', html.includes('The four comparison dates are unverified fixtures') && html.includes('coordinate-frame question remains open')],
            ['K bracket labelled as a current candidate, not a canonical result', html.includes('Current K bracket') && !html.includes('Classical K bracket')],
            ['Mercury swift-motion limitation disclosed', html.includes('Mercury is excluded from these four reference cases')],
            ['threshold test no longer labelled a classical implementation', !html.includes('8. Classical Asta / Udaya Threshold Test')]
          ];
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          checks.push(['no duplicate HTML IDs', duplicates.length === 0]);
          const moduleScript = [...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/gi)][0]?.[1];
          if (!moduleScript) {
            checks.push(['module script exists', false]);
          } else {
            fs.writeFileSync('/tmp/test-astronomy-module.mjs', moduleScript);
            const syntax = spawnSync(process.execPath, ['--check', '/tmp/test-astronomy-module.mjs'], { encoding: 'utf8' });
            checks.push(['main module script syntax', syntax.status === 0]);
            if (syntax.status !== 0) console.error(syntax.stderr);
          }
          for (const [name, passed] of checks) console.log(`${passed ? 'PASS' : 'FAIL'} — ${name}`);
          const failed = checks.filter(([, passed]) => !passed);
          if (failed.length) process.exit(1);
          NODE

      - name: Run headless Chromium research-page test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node ss_chapter9_browser_test.mjs

      - name: Confirm production Panchang files are unchanged
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- app.js extra-panchang.js
