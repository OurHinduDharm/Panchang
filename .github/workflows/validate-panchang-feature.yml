name: Validate Panchang feature
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/hindu-festivals-card, feature/nakshatra-saraswati-puja]

permissions:
  contents: read

jobs:
  syntax-and-nivasa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --experimental-default-type=module --check extra-panchang.js
          node --experimental-default-type=module --check festivals.js
          node --experimental-default-type=module --check nivas.js
          node --experimental-default-type=module --check festival-filter.js
          node --experimental-default-type=module --check monthly-vrat-parv-widget.js
          node --experimental-default-type=module --check festival-muhurta.js
      - name: Check astronomy diagnostic module and reference-location wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('test-astronomy.html', 'utf8');
          const moduleScript = [...html.matchAll(/<script type="module">([\\s\\S]*?)<\\/script>/gi)][0]?.[1];
          if (!moduleScript) throw new Error('test-astronomy.html has no module script');
          fs.writeFileSync('/tmp/test-astronomy-module.mjs', moduleScript);
          const syntax = spawnSync(process.execPath, ['--check', '/tmp/test-astronomy-module.mjs'], { encoding: 'utf8' });
          if (syntax.status !== 0) {
            console.error(syntax.stderr);
            process.exit(syntax.status ?? 1);
          }
          const checks = [
            ['Dehradun reference configuration exists', html.includes('const DEHRADUN_CONFIG =')],
            ['Reference location selects matching observer', html.includes('function configForReference(ref)') && html.includes('observerForConfig(configForReference(ref))')],
            ['Swiss heliacal input uses reference coordinates', html.includes('const refConfig = configForReference(ref);') && html.includes('Number(refConfig.longitude)') && html.includes('Number(refConfig.latitude)')],
            ['Pithoragarh user benchmarks remain separate', html.includes('DRIK_PITHORAGARH_BOUNDARIES')]
          ];
          for (const [name, passed] of checks) console.log(`${passed ? 'PASS' : 'FAIL'} — ${name}`);
          if (checks.some(([, passed]) => !passed)) process.exit(1);
          NODE
      - name: Run Agnivasa/Shivavasa regression tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
