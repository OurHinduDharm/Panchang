name: Validate Panchang feature
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/hindu-festivals-card, feature/nakshatra-saraswati-puja]

permissions:
  contents: read

jobs:
  syntax-and-nivasa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --experimental-default-type=module --check app.js
          node --experimental-default-type=module --check night-prahar.js
          node --experimental-default-type=module --check extra-panchang.js
          node --check local-horizon-events.mjs
          node --experimental-default-type=module --check festivals.js
          node --experimental-default-type=module --check nivas.js
          node --experimental-default-type=module --check festival-filter.js
          node --check festival-detector.mjs
          node --check festival-observance-rules.mjs
          node --experimental-default-type=module --check monthly-vrat-parv-widget.js
          sed -n '/^<script type="module">$/,/^<\/script>$/p' monthly-vrat-parv.html | sed '1d;$d' > /tmp/monthly-vrat-parv.mjs
          node --check /tmp/monthly-vrat-parv.mjs
          node --experimental-default-type=module --check festival-widget.js
          node --check dwadashi-calendar.mjs
          node --experimental-default-type=module --check festival-muhurta.js
          sed -n '/^<script type="module">$/,/^<\/script>$/p' festival-year-review.html | sed '1d;$d' > /tmp/festival-year-review.mjs
          node --check /tmp/festival-year-review.mjs
          sed -n '/^<script type="module">$/,/^<\/script>$/p' asta-udaya-calculator.html | sed '1d;$d' > /tmp/asta-udaya-calculator.mjs
          node --check /tmp/asta-udaya-calculator.mjs
      - name: Install pinned astronomy engines for regression tests
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0 astronomy-engine@2.1.19
      - name: Run Agnivasa/Shivavasa regression tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
      - name: Smoke-test real Astronomy Engine local horizon events
        run: node tests/local-horizon-engine-smoke.mjs
      - name: Run planetary Asta/Udaya direction regression tests
        run: node --experimental-default-type=module --test tests/planetary-asta-udaya-direction.test.js
      - name: Validate uploaded Asta/Udaya data integrity and sampled vectors
        run: node tests/validate-asta-udaya-dataset.mjs
      - name: Measure six-hour vector interpolation error at every interval midpoint
        run: node tests/measure-asta-udaya-interpolation.mjs

  agastya-copernicus-dem-crosscheck:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/agastya-gedtm30-cog-extraction'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
      GDAL_HTTP_TIMEOUT: "60"
      GDAL_HTTP_MAX_RETRY: "3"
      VSI_CACHE: "TRUE"
      VSI_CACHE_SIZE: "50000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster dependencies
        run: python -m pip install --upgrade pip numpy rasterio
      - name: Compute independent Copernicus GLO-30 DSM horizon
        run: |
          mkdir -p artifacts
          TILE="Copernicus_DSM_COG_10_N29_00_E080_00_DEM"
          URL="https://copernicus-dem-30m.s3.amazonaws.com/${TILE}/${TILE}.tif"
          python research/agastya/terrain_horizon.py \
            --dem "/vsicurl/${URL}" \
            --source-label "Copernicus DEM GLO-30 DSM (public AWS COG)" \
            --surface-model \
            --max-distance-m 20000 \
            --step-m 30 \
            --json artifacts/agastya_copernicus_glo30_horizon.json \
            --csv artifacts/agastya_copernicus_glo30_horizon.csv
          test -s artifacts/agastya_copernicus_glo30_horizon.json
          test -s artifacts/agastya_copernicus_glo30_horizon.csv
      - name: Upload independent DEM horizon report
        uses: actions/upload-artifact@v4
        with:
          name: agastya-copernicus-glo30-horizon
          path: artifacts/agastya_copernicus_glo30_horizon.*
          if-no-files-found: error
          retention-days: 14
