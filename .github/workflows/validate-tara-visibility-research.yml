name: Validate Tara visibility research adapters

on:
  push:
    branches: [feature/city-aware-tara-location-profiles]
    paths:
      - "planetary-city-heliacal-engine.mjs"
      - "planetary-heliacal-ephemeris.mjs"
      - "planetary-city-horizon-threshold.mjs"
      - "tests/planetary-city-heliacal-engine.test.mjs"
      - "tests/planetary-heliacal-ephemeris.test.mjs"
      - "tests/planetary-city-horizon-threshold.test.mjs"
      - "research/planetary-city-backtest.mjs"
      - "research/city-observer-profiles.mjs"
      - "research/planetary-conjunction-association.mjs"
      - "data/pithoragarh-guru-shukra-calculated-2028-2030.json"
      - "data/agastya-arghya-pithoragarh.json"
      - "tests/planetary-conjunction-association.test.mjs"
      - ".github/workflows/validate-tara-visibility-research.yml"
  pull_request:
    branches: [fix/agastya-public-source-gating]
    paths:
      - "planetary-heliacal-visibility.mjs"
      - "planetary-heliacal-ephemeris.mjs"
      - "planetary-city-heliacal-engine.mjs"
      - "planetary-city-horizon-threshold.mjs"
      - "tests/planetary-city-horizon-threshold.test.mjs"
      - "research/planetary-city-backtest.mjs"
      - "research/city-observer-profiles.mjs"
      - "research/planetary-conjunction-association.mjs"
      - "tests/planetary-conjunction-association.test.mjs"
      - "research/pithoragarh-horizon-thresholds-2021-2025.json"
      - "data/drik-planetary-reference-2024-2027.json"
      - "planetary-city-location.mjs"
      - "agastya-canopus-position.mjs"
      - "tests/planetary-heliacal-visibility.test.mjs"
      - "tests/planetary-heliacal-ephemeris.test.mjs"
      - "tests/planetary-city-heliacal-engine.test.mjs"
      - "tests/planetary-city-location.test.mjs"
      - "tests/agastya-canopus-position.test.mjs"
      - ".github/workflows/validate-tara-visibility-research.yml"

permissions:
  contents: read

jobs:
  research-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned free astronomy engine
        run: npm install --no-save astronomy-engine@2.1.19
      - name: Run visibility, city-profile and Agastya tests
        run: |
          node --test tests/planetary-heliacal-visibility.test.mjs
          node --test tests/planetary-heliacal-ephemeris.test.mjs
          node --test tests/planetary-city-heliacal-engine.test.mjs
          node --test tests/planetary-city-horizon-threshold.test.mjs
          node --test tests/planetary-conjunction-association.test.mjs
          node --test tests/planetary-city-location.test.mjs
          node --test tests/agastya-canopus-position.test.mjs
      - name: Resolve five city-centre observer coordinates and DEM elevations
        run: node research/city-observer-profiles.mjs --output city-observer-profiles.json
      - name: Back-test city model against Pithoragarh Guru/Shukra records
        run: node research/planetary-city-backtest.mjs --output planetary-city-backtest.json
      - name: Upload city-profile and research-only back-test reports
        uses: actions/upload-artifact@v4
        with:
          name: city-wise-guru-shukra-observer-backtest
          path: |
            city-observer-profiles.json
            planetary-city-backtest.json
          if-no-files-found: error
      - name: Smoke-test the real Astronomy Engine adapter
        run: |
          node --input-type=module -e 'import * as A from "astronomy-engine"; import {getCanopusHorizontalPosition} from "./agastya-canopus-position.mjs"; const p=getCanopusHorizontalPosition({astronomy:A,observer:new A.Observer(29.5828,80.2182,1650),instant:"2028-09-01T00:00:00Z"}); if(!Number.isFinite(p.altitudeDeg)||!Number.isFinite(p.azimuthDeg)) throw new Error(JSON.stringify(p)); console.log(JSON.stringify(p));'
