name: Vinayaka Chaturthi real Panchang validation
on:
  push:
    branches:
      - verify/2026-vinayaka-madhyahna-pithoragarh
    paths:
      - 'tests/vinayaka-real-panchang-2026.test.js'
      - '.github/workflows/vinayaka-panchang-validation.yml'
  pull_request:
    paths:
      - 'tests/vinayaka-real-panchang-2026.test.js'
      - '.github/workflows/vinayaka-panchang-validation.yml'
permissions:
  contents: read
jobs:
  vinayaka-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Panchang engine
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Validate Madhyahna and Chaturthi
        run: node --test tests/vinayaka-real-panchang-2026.test.js tests/festival-muhurta-parana.test.mjs
