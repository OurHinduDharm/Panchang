name: Prepare readable Vrat Parichay text chunks

on:
  workflow_dispatch:
  push:
    paths:
      - "data/vrat-parichay.txt"
      - "tools/split_vrat_parichay.py"
      - ".github/workflows/vrat-parichay-chunks.yml"

permissions:
  contents: write

jobs:
  split-text:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Split source into readable chunks
        run: python tools/split_vrat_parichay.py
      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vrat-parichay-chunks/
          if git diff --cached --quiet; then
            echo "Chunks are already up to date."
          else
            git commit -m "Generate readable Vrat Parichay text chunks"
            git push
          fi
