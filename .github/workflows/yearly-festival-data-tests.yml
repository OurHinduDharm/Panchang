name: Yearly Festival Data Migration Tests

on:
  push:
    branches:
      - feat/yearly-festival-data-foundation
      - feat/samaveda-annual-json-integration
    paths:
      - 'scripts/merge-festival-months-to-yearly.mjs'
      - 'samaveda-annual-review.js'
      - 'festival-muhurta.js'
      - 'festival-year-review.html'
      - 'eclipse-panchang.js'
      - 'tests/eclipse-panchang-visibility.test.mjs'
      - 'tests/samaveda-annual-review.test.mjs'
      - 'tests/merge-festival-months-to-yearly.test.mjs'
      - '.github/workflows/yearly-festival-data-tests.yml'
  pull_request:
    paths:
      - 'scripts/merge-festival-months-to-yearly.mjs'
      - 'samaveda-annual-review.js'
      - 'festival-year-review.html'
      - 'eclipse-panchang.js'
      - 'tests/eclipse-panchang-visibility.test.mjs'
      - 'tests/samaveda-annual-review.test.mjs'
      - 'tests/merge-festival-months-to-yearly.test.mjs'
      - '.github/workflows/yearly-festival-data-tests.yml'

permissions:
  contents: read

jobs:
  yearly-festival-data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Panchanga library for annual astronomy tests
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Run yearly migration, Samaveda annual decision, and local eclipse visibility tests
        run: node --test tests/merge-festival-months-to-yearly.test.mjs tests/samaveda-annual-review.test.mjs tests/eclipse-panchang-visibility.test.mjs
