name: Yearly Festival Data Migration Tests

on:
  push:
    branches:
      - feat/yearly-festival-data-foundation
      - feat/samaveda-annual-json-integration
    paths:
      - 'scripts/merge-festival-months-to-yearly.mjs'
      - 'scripts/audit-annual-publication-readiness.mjs'
      - 'scripts/audit-festival-catalog.mjs'
      - 'tests/festival-catalog-integrity.test.mjs'
      - 'tests/2030-festival-audit.test.mjs'
      - 'tests/festival-data-integrity.test.mjs'
      - 'tests/recurring-muhurta-rule-coverage-2026-2030.test.mjs'
      - 'monthly-vrat-parv-widget.js'
      - 'tests/monthly-focus-before-enrichment.test.mjs'
      - 'monthly-vrat-parv-widget.js'
      - 'tests/monthly-focus-before-enrichment.test.mjs'
      - 'festival-muhurta.js'
      - 'scripts/generate-annual-dwadashi-review.mjs'
      - 'data/festivals/**'
      - 'data/dwadashi/**'
      - 'data/chaturmas/**'
      - 'data/references/**'
      - 'data/ohd-annual-panchang-review-*.json'
      - 'data/dwadashi-vrata-rules.json'
      - 'samaveda-annual-review.js'
      - 'festival-muhurta.js'
      - 'festival-year-review.html'
      - 'eclipse-panchang.js'
      - 'tests/audit-annual-publication-readiness.test.mjs'
      - 'tests/eclipse-panchang-visibility.test.mjs'
      - 'tests/samaveda-annual-review.test.mjs'
      - 'tests/merge-festival-months-to-yearly.test.mjs'
      - '.github/workflows/yearly-festival-data-tests.yml'
  pull_request:
    paths:
      - 'scripts/merge-festival-months-to-yearly.mjs'
      - 'scripts/audit-annual-publication-readiness.mjs'
      - 'scripts/audit-festival-catalog.mjs'
      - 'tests/festival-catalog-integrity.test.mjs'
      - 'tests/2030-festival-audit.test.mjs'
      - 'festival-muhurta.js'
      - 'scripts/generate-annual-dwadashi-review.mjs'
      - 'data/festivals/**'
      - 'data/dwadashi/**'
      - 'data/chaturmas/**'
      - 'data/references/**'
      - 'data/ohd-annual-panchang-review-*.json'
      - 'data/dwadashi-vrata-rules.json'
      - 'samaveda-annual-review.js'
      - 'festival-year-review.html'
      - 'eclipse-panchang.js'
      - 'tests/audit-annual-publication-readiness.test.mjs'
      - 'tests/eclipse-panchang-visibility.test.mjs'
      - 'tests/samaveda-annual-review.test.mjs'
      - 'tests/merge-festival-months-to-yearly.test.mjs'
      - '.github/workflows/yearly-festival-data-tests.yml'

permissions:
  contents: read

jobs:
  yearly-festival-data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Panchanga library for annual astronomy tests
        run: npm install --no-save @ishubhamx/panchangam-js@3.0.0
      - name: Run yearly migration, annual readiness, Samaveda decision, and local eclipse visibility tests
        run: node --test tests/merge-festival-months-to-yearly.test.mjs tests/audit-annual-publication-readiness.test.mjs tests/samaveda-annual-review.test.mjs tests/eclipse-panchang-visibility.test.mjs
      - name: Run 2030 annual festival and muhurta regression audit
        run: node --test tests/2030-festival-audit.test.mjs
      - name: Run recurring Pradosh and Masik Shivaratri muhurta rule coverage
        run: node --test tests/recurring-muhurta-rule-coverage-2026-2030.test.mjs tests/monthly-focus-before-enrichment.test.mjs
      - name: Run monthly festival data integrity tests
        run: node --test tests/festival-data-integrity.test.mjs
      - name: Audit every monthly festival catalog from 2026 through 2030
        run: |
          for year in 2026 2027 2028 2029 2030; do
            node scripts/audit-festival-catalog.mjs "$year"
          done
