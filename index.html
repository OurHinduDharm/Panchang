<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>हिंदू पंचांग | OurHinduDharm</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:linear-gradient(135deg,#fff8e7,#ffe0b2);
  color:#3b2415;
}

.container{
  max-width:680px;
  margin:auto;
  padding:14px;
}

.header{
  background:linear-gradient(135deg,#8e2100,#d85b00);
  color:#fff;
  text-align:center;
  padding:22px 15px;
  border-radius:20px;
  box-shadow:0 5px 18px #0002;
}

.header h1{
  margin:0 0 5px;
  font-size:28px;
}

.header p{
  margin:0;
  opacity:.9;
}

.searchbox{
  background:#fff;
  margin-top:14px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 3px 12px #0002;
}

.searchbox label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.searchrow{
  display:flex;
  gap:8px;
}

.searchrow input{
  flex:1;
  min-width:0;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#d35400;
}

button{
  border:0;
  background:#c0392b;
  color:white;
  padding:11px 15px;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#777;
  margin-top:9px;
  width:100%;
}

#suggestions{
  margin-top:8px;
}

.city{
  padding:11px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.city:hover{
  background:#fff3df;
}

.selected{
  margin-top:10px;
  padding:9px;
  background:#fff3df;
  border-radius:9px;
  font-size:14px;
}

.datebox{
  background:#fff;
  margin-top:14px;
  padding:15px;
  border-radius:16px;
  box-shadow:0 3px 12px #0002;
}

.datebox label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.datebuttons{
  margin-top:9px;
  display:flex;
  gap:7px;
}

.datebuttons button{
  flex:1;
}

.date-title{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:18px 0 12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:14px;
  box-shadow:0 2px 9px #0002;
  border-left:4px solid #d35400;
}

.card.full{
  grid-column:1/-1;
}

.label{
  color:#777;
  font-size:13px;
  margin-bottom:5px;
}

.value{
  font-size:17px;
  font-weight:bold;
}

.loading{
  text-align:center;
  background:#fff;
  padding:20px;
  margin-top:14px;
  border-radius:15px;
}

.error{
  background:#ffe1e1;
  color:#900;
  padding:14px;
  margin-top:14px;
  border-radius:12px;
}

.footer{
  text-align:center;
  color:#777;
  font-size:12px;
  margin:20px 0;
}

@media(max-width:480px){
  .searchrow{
    flex-direction:column;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🕉️ हिंदू पंचांग</h1>
    <p>OurHinduDharm</p>
  </div>

  <!-- CITY SEARCH -->

  <div class="searchbox">

    <label>📍 अपना शहर खोजें</label>

    <div class="searchrow">
      <input
        id="cityInput"
        type="text"
        placeholder="जैसे Pithoragarh, Delhi, Mumbai..."
        autocomplete="off"
      >

      <button onclick="searchCity()">🔍 खोजें</button>
    </div>

    <button class="secondary" onclick="useMyLocation()">
      📍 मेरी वर्तमान Location
    </button>

    <div id="suggestions"></div>

    <div id="selectedCity" class="selected" style="display:none"></div>

  </div>


  <!-- DATE -->

  <div class="datebox">

    <label>📅 तारीख</label>

    <input type="date" id="dateInput">

    <div class="datebuttons">
      <button onclick="today()">आज</button>
      <button onclick="previousDay()">‹ पिछला</button>
      <button onclick="nextDay()">अगला ›</button>
    </div>

  </div>


  <!-- RESULT -->

  <div id="result">
    <div class="loading">
      पहले अपना शहर खोजें और चुनें।
    </div>
  </div>


  <div class="footer">
    Panchang calculations powered by Panchangam JS
  </div>

</div>


<script type="module">

import {
  getPanchangam,
  Observer,
  tithiNames,
  nakshatraNames,
  yogaNames
} from "https://esm.sh/@ishubhamx/panchangam-js@3.0.0";


// --------------------------------
// VARIABLES
// --------------------------------

let selectedLocation = null;

const cityInput =
  document.getElementById("cityInput");

const dateInput =
  document.getElementById("dateInput");

const suggestions =
  document.getElementById("suggestions");

const selectedCity =
  document.getElementById("selectedCity");

const result =
  document.getElementById("result");


// --------------------------------
// TODAY
// --------------------------------

function todayString(){

  const d = new Date();

  return d.getFullYear()
    + "-"
    + String(d.getMonth()+1).padStart(2,"0")
    + "-"
    + String(d.getDate()).padStart(2,"0");
}

dateInput.value = todayString();


// --------------------------------
// SEARCH CITY
// --------------------------------

window.searchCity = async function(){

  const q =
    cityInput.value.trim();

  if(q.length < 2){

    alert("कम से कम 2 अक्षर शहर का नाम लिखें।");
    return;
  }

  suggestions.innerHTML =
    `<div class="loading">🔎 शहर खोजा जा रहा है...</div>`;

  try{

    const url =
      "https://nominatim.openstreetmap.org/search"
      + "?format=json"
      + "&addressdetails=1"
      + "&limit=5"
      + "&q="
      + encodeURIComponent(q);

    const response =
      await fetch(url,{
        headers:{
          "Accept":"application/json"
        }
      });

    if(!response.ok){
      throw new Error("City search failed");
    }

    const places =
      await response.json();

    if(!places.length){

      suggestions.innerHTML =
        `<div class="error">
          ❌ शहर नहीं मिला। दूसरा नाम आज़माएँ।
        </div>`;

      return;
    }

    suggestions.innerHTML = "";

    places.forEach(place => {

      const div =
        document.createElement("div");

      div.className = "city";

      div.innerHTML =
        "📍 " + place.display_name;

      div.onclick = () => {

        selectCity(place);

      };

      suggestions.appendChild(div);

    });

  }
  catch(error){

    console.error(error);

    suggestions.innerHTML =
      `<div class="error">
        ❌ शहर खोजने में समस्या हुई।
        कृपया Internet connection जाँचें।
      </div>`;

  }

};


// --------------------------------
// SELECT CITY
// --------------------------------

function selectCity(place){

  selectedLocation = {

    name: place.display_name,

    lat: Number(place.lat),

    lon: Number(place.lon),

    elevation: 0

  };


  cityInput.value =
    place.name ||
    place.display_name;


  selectedCity.style.display =
    "block";

  selectedCity.innerHTML =
    "✅ चुना गया स्थान:<br><b>"
    + place.display_name
    + "</b>";


  suggestions.innerHTML = "";


  // SAVE LOCATION

  try{

    localStorage.setItem(
      "ohdPanchangLocation",
      JSON.stringify(selectedLocation)
    );

  }
  catch(e){}


  calculatePanchang();

}


// --------------------------------
// LOAD SAVED LOCATION
// --------------------------------

try{

  const saved =
    localStorage.getItem(
      "ohdPanchangLocation"
    );

  if(saved){

    selectedLocation =
      JSON.parse(saved);

    selectedCity.style.display =
      "block";

    selectedCity.innerHTML =
      "💾 पिछला चुना गया स्थान:<br><b>"
      + selectedLocation.name
      + "</b>";

  }

}
catch(e){}


// --------------------------------
// PANCHANG
// --------------------------------

function calculatePanchang(){

  if(!selectedLocation){

    result.innerHTML =
      `<div class="loading">
        पहले अपना शहर चुनें।
      </div>`;

    return;
  }


  result.innerHTML =
    `<div class="loading">
      🕉️ पंचांग की गणना हो रही है...
    </div>`;


  try{

    const observer =
      new Observer(
        selectedLocation.lat,
        selectedLocation.lon,
        selectedLocation.elevation
      );


    /*
      Noon date is used as input.
      Library handles sunrise-anchored
      Panchang calculations.
    */

    const date =
      new Date(
        dateInput.value
        + "T12:00:00"
      );


    const p =
      getPanchangam(
        date,
        observer,
        {
          timezoneOffset:330
        }
      );


    displayPanchang(p);

  }
  catch(error){

    console.error(error);

    result.innerHTML =
      `<div class="error">
        ❌ पंचांग की गणना नहीं हो सकी।<br><br>
        <small>${error.message || error}</small>
      </div>`;

  }

}


// --------------------------------
// DISPLAY
// --------------------------------

function displayPanchang(p){

  const date =
    new Date(
      dateInput.value
      + "T12:00:00"
    );


  const dateText =
    date.toLocaleDateString(
      "hi-IN",
      {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );


  result.innerHTML = `

    <div class="date-title">
      ${dateText}
    </div>

    <div class="grid">

      <div class="card">
        <div class="label">वार</div>
        <div class="value">
          ${getVara(p)}
        </div>
      </div>


      <div class="card">
        <div class="label">पक्ष</div>
        <div class="value">
          ${p.paksha || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">तिथि</div>
        <div class="value">
          ${tithiNames[p.tithi] || p.tithi || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">मास</div>
        <div class="value">
          ${p.masa?.name || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">नक्षत्र</div>
        <div class="value">
          ${nakshatraNames[p.nakshatra]
            || p.nakshatra
            || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">योग</div>
        <div class="value">
          ${yogaNames[p.yoga]
            || p.yoga
            || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">करण</div>
        <div class="value">
          ${p.karana || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">ऋतु</div>
        <div class="value">
          ${p.ritu || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">अयन</div>
        <div class="value">
          ${p.ayana || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">विक्रम संवत</div>
        <div class="value">
          ${p.samvat || "—"}
        </div>
      </div>


      <div class="card">
        <div class="label">🌅 सूर्योदय</div>
        <div class="value">
          ${formatTime(p.sunrise)}
        </div>
      </div>


      <div class="card">
        <div class="label">🌇 सूर्यास्त</div>
        <div class="value">
          ${formatTime(p.sunset)}
        </div>
      </div>


      <div class="card">
        <div class="label">🌙 चंद्रोदय</div>
        <div class="value">
          ${formatTime(p.moonrise)}
        </div>
      </div>


      <div class="card">
        <div class="label">🌙 चंद्रास्त</div>
        <div class="value">
          ${formatTime(p.moonset)}
        </div>
      </div>


      <div class="card full">
        <div class="label">📍 स्थान</div>
        <div class="value">
          ${selectedLocation.name}
        </div>
      </div>

    </div>
  `;

}


// --------------------------------
// VARA
// --------------------------------

function getVara(p){

  if(p.varaName)
    return p.varaName;

  const names = [
    "रविवार",
    "सोमवार",
    "मंगलवार",
    "बुधवार",
    "गुरुवार",
    "शुक्रवार",
    "शनिवार"
  ];

  if(typeof p.vara === "number")
    return names[p.vara];

  return p.vara || "—";
}


// --------------------------------
// TIME
// --------------------------------

function formatTime(value){

  if(!value)
    return "—";

  try{

    return new Date(value)
      .toLocaleTimeString(
        "hi-IN",
        {
          hour:"2-digit",
          minute:"2-digit",
          hour12:true
        }
      );

  }
  catch(e){

    return "—";

  }

}


// --------------------------------
// DATE CHANGE
// --------------------------------

dateInput.addEventListener(
  "change",
  calculatePanchang
);


// --------------------------------
// TODAY
// --------------------------------

window.today = function(){

  dateInput.value =
    todayString();

  calculatePanchang();

};


// --------------------------------
// PREVIOUS
// --------------------------------

window.previousDay = function(){

  const d =
    new Date(
      dateInput.value
      + "T12:00:00"
    );

  d.setDate(
    d.getDate()-1
  );

  dateInput.value =
    d.getFullYear()
    + "-"
    + String(d.getMonth()+1).padStart(2,"0")
    + "-"
    + String(d.getDate()).padStart(2,"0");

  calculatePanchang();

};


// --------------------------------
// NEXT
// --------------------------------

window.nextDay = function(){

  const d =
    new Date(
      dateInput.value
      + "T12:00:00"
    );

  d.setDate(
    d.getDate()+1
  );

  dateInput.value =
    d.getFullYear()
    + "-"
    + String(d.getMonth()+1).padStart(2,"0")
    + "-"
    + String(d.getDate()).padStart(2,"0");

  calculatePanchang();

};


// --------------------------------
// GPS
// --------------------------------

window.useMyLocation = function(){

  if(!navigator.geolocation){

    alert(
      "आपके browser में Location सुविधा उपलब्ध नहीं है।"
    );

    return;
  }


  result.innerHTML =
    `<div class="loading">
      📍 आपकी location ली जा रही है...
    </div>`;


  navigator.geolocation.getCurrentPosition(

    position => {

      selectedLocation = {

        name:"वर्तमान स्थान",

        lat:
          position.coords.latitude,

        lon:
          position.coords.longitude,

        elevation:
          position.coords.altitude || 0

      };


      selectedCity.style.display =
        "block";

      selectedCity.innerHTML =
        "📍 <b>वर्तमान स्थान</b>";


      try{

        localStorage.setItem(
          "ohdPanchangLocation",
          JSON.stringify(selectedLocation)
        );

      }
      catch(e){}


      calculatePanchang();

    },

    error => {

      result.innerHTML =
        `<div class="error">
          ❌ Location permission नहीं मिली।
          <br><br>
          आप शहर का नाम manually खोज सकते हैं।
        </div>`;

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:86400000
    }

  );

};

</script>

</body>
</html>
