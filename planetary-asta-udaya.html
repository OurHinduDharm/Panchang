<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="स्थान के अनुसार गुरु और शुक्र तारा अस्त-उदय तथा अगस्त्य तारा उदय और अर्घ्य की वर्षवार तिथि एवं समय।">
<title>गुरु-शुक्र एवं अगस्त्य तारा उदय-अस्त पंचांग | OurHinduDharm</title>
<style>
:root{color-scheme:light;--ink:#28231d;--muted:#686157;--line:#e5dfd5;--paper:#fff;--bg:#f6f4ef;--accent:#81391f}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans Devanagari",sans-serif}
main{max-width:920px;margin:auto}
h1{font-size:1.55rem;line-height:1.35;margin:0 0 6px}
h2{font-size:1.15rem;margin:0 0 12px}
p{margin:7px 0}
.muted{color:var(--muted);font-size:.92rem}
.panel,.planet{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px;margin:14px 0}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
label{font-weight:650}
select{font:inherit;padding:9px 12px;border:1px solid #cfc8bc;border-radius:8px;background:white;min-width:120px}
.planet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.planet{margin:0}
.window{padding:10px 0;border-top:1px solid var(--line)}
.window:first-of-type{border-top:0}
.window strong{display:block;margin-bottom:5px}
.times{display:grid;gap:4px;font-size:.94rem}
.empty{color:var(--muted);font-size:.9rem}
.status{padding:10px;border-radius:8px;background:#f1eee8}
@media(max-width:480px){body{padding:12px}.panel,.planet{padding:12px}}
</style>
</head>
<body>
<main>
<header>
<h1>गुरु, शुक्र एवं अगस्त्य तारा उदय-अस्त पंचांग</h1>
<p class="muted">गणना से प्राप्त वार्षिक तिथियाँ · भारतीय मानक समय</p>
</header>

<section class="panel" aria-label="स्थान अनुसार गणना">
<div class="controls">
<label for="city">स्थान</label>
<select id="city">
<option value="pithoragarh-project-target">पिथौरागढ़</option>
<option value="drikpanchang-almora">अल्मोड़ा</option>
<option value="drikpanchang-ramnagar">रामनगर (नैनीताल)</option>
<option value="delhi">नई दिल्ली</option>
<option value="dehradun">देहरादून</option>
</select>
<label for="forecast-year">वर्ष</label>
<select id="forecast-year"></select>
</div>
<p id="city-status" role="status"></p>
<div id="city-events" class="planet-grid"></div>
<button id="city-retry" type="button" hidden>गणना फिर करें</button>
</section>

</main>
<script type="module" src="./annual-tara-city-page.mjs"></script>


</body>
</html>
