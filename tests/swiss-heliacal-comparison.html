<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss heliacal vs Drik Pithoragarh references</title>
</head>
<body>
<pre id="output">Loading Swiss Ephemeris…</pre>
<script type="module">
import SwissEph from "https://cdn.jsdelivr.net/gh/prolaxu/swisseph-wasm@v0.1.0/src/swisseph.js";

const references = [
  {
    id: "mercury-pithoragarh-2025-asta-start",
    planet: "Mercury", date: "2025-01-19", published: "2025-01-19T06:18:00+05:30",
    eventType: 4, event: "Morning Last", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/budha-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "mercury-pithoragarh-2025-asta-end",
    planet: "Mercury", date: "2025-02-22", published: "2025-02-22T18:51:00+05:30",
    eventType: 3, event: "Evening First", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/budha-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "venus-pithoragarh-2025-asta-start",
    planet: "Venus", date: "2025-03-20", published: "2025-03-20T18:42:00+05:30",
    eventType: 2, event: "Evening Last", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/shukra-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "venus-pithoragarh-2025-asta-end",
    planet: "Venus", date: "2025-03-23", published: "2025-03-23T05:40:00+05:30",
    eventType: 1, event: "Morning First", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/shukra-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "mars-pithoragarh-2025-asta-start",
    planet: "Mars", date: "2025-10-31", published: "2025-10-31T18:23:00+05:30",
    eventType: 2, event: "Evening Last", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/mangal-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "mars-pithoragarh-2025-asta-end",
    planet: "Mars", date: "2026-05-04", published: "2026-05-04T04:14:00+05:30",
    eventType: 1, event: "Morning First", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/mangal-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "jupiter-pithoragarh-2025-asta-start",
    planet: "Jupiter", date: "2025-06-12", published: "2025-06-12T19:47:00+05:30",
    eventType: 2, event: "Evening Last", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/guru-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "jupiter-pithoragarh-2025-asta-end",
    planet: "Jupiter", date: "2025-07-10", published: "2025-07-10T04:27:00+05:30",
    eventType: 1, event: "Morning First", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/guru-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "saturn-pithoragarh-2025-asta-start",
    planet: "Saturn", date: "2025-02-28", published: "2025-02-28T18:53:00+05:30",
    eventType: 2, event: "Evening Last", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/shani-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  },
  {
    id: "saturn-pithoragarh-2025-asta-end",
    planet: "Saturn", date: "2025-04-10", published: "2025-04-10T04:48:00+05:30",
    eventType: 1, event: "Morning First", sourceStatus: "direct-page-captured-browser-verified",
    sourcePageUrl: "https://www.drikpanchang.com/planet/asta/shani-asta-date-time.html?geoname-id=1259503&year=2025&time-format=24plushour&lang=en"
  }
];

function julianDay(ms) {
  return ms / 86400000 + 2440587.5;
}
function fromJulianDay(jd) {
  return new Date((jd - 2440587.5) * 86400000);
}
function formatIST(date) {
  return new Date(date.getTime() + 330 * 60000).toISOString().replace("Z", "+05:30");
}
function localDayNumber(isoDateTime) {
  const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(isoDateTime);
  if (!match) throw new Error("Invalid local date: " + isoDateTime);
  return Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])) / 86400000;
}

try {
  const swiss = new SwissEph();
  await swiss.initSwissEph();
  if (typeof swiss.heliacal_ut !== "function") throw new Error("Swiss heliacal_ut API unavailable.");

  const geoPos = [80.2182, 29.5828, 1650];
  const scenarios = [
    { name: "baseline-age36-default-range", atmosphere: [1013.25, 15, 40, 0], observer: [36, 1, 0, 0, 0, 0] },
    { name: "age23-default-range", atmosphere: [1013.25, 15, 40, 0], observer: [23, 1, 0, 0, 0, 0] },
    { name: "age23-range80km", atmosphere: [1013.25, 15, 40, 80], observer: [23, 1, 0, 0, 0, 0] },
    { name: "age23-range120km", atmosphere: [1013.25, 15, 40, 120], observer: [23, 1, 0, 0, 0, 0] },
    { name: "age23-range200km", atmosphere: [1013.25, 15, 40, 200], observer: [23, 1, 0, 0, 0, 0] },
    { name: "age23-range300km", atmosphere: [1013.25, 15, 40, 300], observer: [23, 1, 0, 0, 0, 0] },
    { name: "age23-range500km", atmosphere: [1013.25, 15, 40, 500], observer: [23, 1, 0, 0, 0, 0] },
    { name: "age23-range1000km", atmosphere: [1013.25, 15, 40, 1000], observer: [23, 1, 0, 0, 0, 0] }
  ];
  const flags = 2 | 256;
  const results = [];

  for (const scenario of scenarios) {
    const scenarioResults = [];
    for (const ref of references) {
      const start = new Date(ref.date + "T00:00:00Z");
      start.setUTCDate(start.getUTCDate() - 50);
      const raw = swiss.heliacal_ut(
        julianDay(start.getTime()),
        geoPos,
        scenario.atmosphere,
        scenario.observer,
        (ref.planet || "Venus").toLowerCase(),
        ref.eventType,
        flags
      );
      if (!raw || raw.length < 3) throw new Error("Invalid Swiss result for " + ref.id + " / " + scenario.name);
      const eventDate = fromJulianDay(Number(raw[0]));
      const publishedMs = Date.parse(ref.published);
      scenarioResults.push({
        id: ref.id,
        planet: ref.planet || "Venus",
        sourceStatus: ref.sourceStatus || "published-indexed",
        event: ref.event,
        publishedIST: ref.published,
        swissIST: formatIST(eventDate),
        signedDateOffsetDays: localDayNumber(formatIST(eventDate)) - localDayNumber(ref.published),
        nonComparableClockOffsetMinutes: Math.round((eventDate.getTime() - publishedMs) / 60000),
        visibilityOptimumIST: formatIST(fromJulianDay(Number(raw[1]))),
        visibilityEndIST: formatIST(fromJulianDay(Number(raw[2])))
      });
    }
    const meanAbsoluteDateError = rows => rows.length
      ? Number((rows.reduce((sum, item) => sum + Math.abs(item.signedDateOffsetDays), 0) / rows.length).toFixed(3))
      : null;
    const meanAbsoluteDateErrorDays = meanAbsoluteDateError(scenarioResults);
    const publishedReferenceMaeDays = meanAbsoluteDateError(
      scenarioResults.filter(item => item.sourceStatus === "published-indexed" || item.sourceStatus === "direct-page-captured-browser-verified")
    );
    const provisionalReferenceMaeDays = meanAbsoluteDateError(
      scenarioResults.filter(item => item.sourceStatus === "user-reported-provisional")
    );
    results.push({
      name: scenario.name,
      atmosphere: scenario.atmosphere,
      observer: scenario.observer,
      meanAbsoluteDateErrorDays,
      publishedReferenceMaeDays,
      provisionalReferenceMaeDays,
      clockComparisonWarning: "Do not compare Swiss heliacal-event clock time with the published Asta/Udaya local planet rise/set timestamp; compare local event dates only.",
      results: scenarioResults
    });
  }

  // Independent diagnostic: inspect the modelled limiting magnitude around
  // each published boundary. This does not assume that Swiss visibility events
  // are equivalent to Drik's event definition.
  if (typeof swiss.vis_limit_mag !== "function") {
    throw new Error("Swiss vis_limit_mag API unavailable.");
  }
  const visibilityLimitProfiles = [];
  const profileOffsetsMinutes = [-20, -10, -5, 0, 5, 10, 20];
  for (const ref of references) {
    const planet = (ref.planet || "Venus").toLowerCase();
    const publishedMs = Date.parse(ref.published);
    const samples = profileOffsetsMinutes.map(offsetMinutes => {
      const jd = julianDay(publishedMs + offsetMinutes * 60000);
      const raw = swiss.vis_limit_mag(
        jd,
        [...geoPos],
        [1013.25, 15, 40, 0],
        [36, 1, 0, 0, 0, 0],
        planet,
        flags
      );
      if (!raw) {
        return { offsetMinutes, status: "unavailable-or-below-horizon" };
      }
      const limitingMagnitude = Number(raw[0]);
      const planetMagnitude = Number(raw[7]);
      return {
        offsetMinutes,
        status: "calculated",
        limitingMagnitude: Number.isFinite(limitingMagnitude) ? Number(limitingMagnitude.toFixed(4)) : null,
        planetMagnitude: Number.isFinite(planetMagnitude) ? Number(planetMagnitude.toFixed(4)) : null,
        visibilityMargin: Number.isFinite(limitingMagnitude) && Number.isFinite(planetMagnitude)
          ? Number((limitingMagnitude - planetMagnitude).toFixed(4))
          : null,
        planetAltitudeDegrees: Number.isFinite(raw[1]) ? Number(raw[1].toFixed(4)) : null,
        sunAltitudeDegrees: Number.isFinite(raw[3]) ? Number(raw[3].toFixed(4)) : null,
        moonAltitudeDegrees: Number.isFinite(raw[5]) ? Number(raw[5].toFixed(4)) : null
      };
    });
    visibilityLimitProfiles.push({
      id: ref.id,
      planet: ref.planet || "Venus",
      sourceStatus: ref.sourceStatus || "published-indexed",
      publishedIST: ref.published,
      event: ref.event,
      assumptions: {
        atmosphere: [1013.25, 15, 40, 0],
        observer: [36, 1, 0, 0, 0, 0],
        flags,
        note: "Baseline diagnostic only; no parameter fitting."
      },
      samples
    });
  }

  window.__SWISS_RESULT__ = {
    location: { latitude: 29.5828, longitude: 80.2182, elevationMeters: 1650, timeZone: "Asia/Kolkata" },
    scenarioCount: results.length,
    warning: "Swiss heliacal events predict first/last visibility moments; the published Asta/Udaya clock time is the planet's own local rise/set. The old minute-MAE was not a valid like-for-like metric. Date offsets are now primary; clock offsets are retained only as explicitly non-comparable diagnostics. Swiss is not a Drik clone; this test now uses ten direct Pithoragarh 2025 references spanning all five visible planets.",
    scenarios: results,
    visibilityLimitProfiles
  };
  document.getElementById("output").textContent = JSON.stringify(window.__SWISS_RESULT__, null, 2);
} catch (error) {
  window.__SWISS_ERROR__ = error?.stack || String(error);
  document.getElementById("output").textContent = window.__SWISS_ERROR__;
}
</script>
</body>
</html>
